<div class="painel-topo">
  <p class="titulo">Painel da cozinha</p>
  <p class="perfil">Você entrou como {{ perfil() }}</p>
</div>

<nav class="menu" aria-label="Seções do painel">
  <a routerLink="/admin/pedidos" routerLinkActive="ativo">Pedidos</a>
  @if (gestao()) {
    <a routerLink="/admin/pratos" routerLinkActive="ativo">Cardápio</a>
    <a routerLink="/admin/categorias" routerLinkActive="ativo">Categorias</a>
    <a routerLink="/admin/estoque" routerLinkActive="ativo">
      Estoque
      @if (totalAlertas() > 0) {
        <span class="selo" [attr.aria-label]="totalAlertas() + ' ingredientes abaixo do mínimo'">
          {{ totalAlertas() }}
        </span>
      }
    </a>
    <a routerLink="/admin/ingredientes" routerLinkActive="ativo">Ingredientes</a>
  }
  @if (admin()) {
    <a routerLink="/admin/usuarios" routerLinkActive="ativo">Usuários</a>
  }
</nav>

<router-outlet />
