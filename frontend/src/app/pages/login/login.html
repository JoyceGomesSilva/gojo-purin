<mat-card class="auth-card">
  <mat-card-header>
    <mat-card-title>Entrar</mat-card-title>
    <mat-card-subtitle>Acesse sua conta do Gojo Purin</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="entrar()">
      <mat-form-field appearance="outline">
        <mat-label>E-mail</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.hasError('required')) {
          <mat-error>Informe o e-mail</mat-error>
        } @else if (form.controls.email.hasError('email')) {
          <mat-error>E-mail inválido</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <input matInput type="password" formControlName="senha" autocomplete="current-password" />
        @if (form.controls.senha.hasError('required')) {
          <mat-error>Informe a senha</mat-error>
        }
      </mat-form-field>

      <button mat-flat-button class="enviar" type="submit" [disabled]="carregando()">
        {{ carregando() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <p class="rodape">
      Ainda não tem conta?
      <a routerLink="/cadastro" [queryParams]="{ voltar: voltar }">Criar conta</a>
    </p>
  </mat-card-content>
</mat-card>
