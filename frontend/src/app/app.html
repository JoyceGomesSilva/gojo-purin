<header class="topo">
  <div class="topo-linha">
    <a class="marca" routerLink="/">Gojo Purin</a>

    <nav class="acoes" aria-label="Conta">
      <a class="carrinho" routerLink="/carrinho">
        @if (carrinho.quantidadeTotal() > 0) {
          Carrinho: {{ carrinho.quantidadeTotal() }}
        } @else {
          Carrinho
        }
      </a>

      @if (auth.sessao(); as sessao) {
        <span class="saudacao">Olá, {{ sessao.nome }}</span>
        @if (auth.equipe()) {
          <a mat-button routerLink="/admin">Painel</a>
        }
        <button mat-button type="button" (click)="sair()">Sair</button>
      } @else {
        <a mat-button routerLink="/login">Entrar</a>
        <a mat-flat-button class="criar-conta" routerLink="/cadastro">Criar conta</a>
      }
    </nav>
  </div>

  <!-- A calda de caramelo escorrendo sobre o pudim. -->
  <svg class="calda" viewBox="0 0 1200 40" preserveAspectRatio="none" aria-hidden="true">
    <path
      d="M0 0h1200v10c-30 0-34 22-60 22s-28-18-58-18-34 26-66 26-30-24-62-24-36 14-70 14-34-20-66-20-30 28-62 28-34-22-66-22-36 12-68 12-32-18-64-18-30 30-62 30-34-26-66-26-36 16-68 16-32-22-64-22-30 24-62 24-34-18-66-18-38 14-70 14-34-20-50-20-26 16-50 16V0z"
    />
  </svg>
</header>

<main class="conteudo">
  <router-outlet />
</main>
